<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">How an agent skill coordinates DJAI MCP tools</title><desc id="desc">A four-layer diagram showing a user outcome, an agent skill playbook, focused MCP tools, and local files with a safety rail across the workflow.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081a31"/><stop offset="1" stop-color="#143a4b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#66e3d6"/></marker><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".22"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/><circle cx="1085" cy="92" r="185" fill="#55d8c9" opacity=".07"/>
  <text x="66" y="70" fill="#83eee3" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" letter-spacing="2">TOOLS PROVIDE ACTIONS • SKILLS PROVIDE JUDGMENT</text><text x="66" y="118" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">From a user goal to a reviewable local result</text><text x="66" y="154" fill="#b7cada" font-family="Inter,Arial,sans-serif" font-size="19">The skill is the playbook between natural-language intent and individual MCP operations.</text>
  <g filter="url(#s)" font-family="Inter,Arial,sans-serif"><rect x="66" y="230" width="235" height="190" rx="22" fill="#173451" stroke="#355c7a"/><circle cx="184" cy="270" r="25" fill="#245475"/><text x="184" y="279" text-anchor="middle" fill="#83eee3" font-size="24" font-weight="800">1</text><text x="184" y="326" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">User outcome</text><text x="184" y="362" text-anchor="middle" fill="#bfd0dc" font-size="16">“Prepare these notes</text><text x="184" y="387" text-anchor="middle" fill="#bfd0dc" font-size="16">for a RAG pipeline”</text>
    <rect x="344" y="230" width="235" height="190" rx="22" fill="#174b47" stroke="#66e3d6" stroke-width="2"/><circle cx="462" cy="270" r="25" fill="#2a847b"/><text x="462" y="279" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">2</text><text x="462" y="326" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">Agent skill</text><text x="462" y="362" text-anchor="middle" fill="#c7f4ef" font-size="16">Chooses order, checks,</text><text x="462" y="387" text-anchor="middle" fill="#c7f4ef" font-size="16">limits and report format</text>
    <rect x="622" y="230" width="235" height="190" rx="22" fill="#173451" stroke="#355c7a"/><circle cx="740" cy="270" r="25" fill="#245475"/><text x="740" y="279" text-anchor="middle" fill="#83eee3" font-size="24" font-weight="800">3</text><text x="740" y="326" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">MCP tools</text><text x="740" y="362" text-anchor="middle" fill="#bfd0dc" font-size="16">Count → clean → chunk</text><text x="740" y="387" text-anchor="middle" fill="#bfd0dc" font-size="16">Focused local actions</text>
    <rect x="900" y="230" width="235" height="190" rx="22" fill="#173451" stroke="#355c7a"/><circle cx="1018" cy="270" r="25" fill="#245475"/><text x="1018" y="279" text-anchor="middle" fill="#83eee3" font-size="24" font-weight="800">4</text><text x="1018" y="326" text-anchor="middle" fill="#fff" font-size="25" font-weight="750">Local result</text><text x="1018" y="362" text-anchor="middle" fill="#bfd0dc" font-size="16">New JSONL + statistics</text><text x="1018" y="387" text-anchor="middle" fill="#bfd0dc" font-size="16">Original file preserved</text></g>
  <g stroke="#66e3d6" stroke-width="4" marker-end="url(#a)"><path d="M306 325h30"/><path d="M584 325h30"/><path d="M862 325h30"/></g>
  <rect x="150" y="495" width="900" height="118" rx="23" fill="#0c223a" stroke="#3f687f"/><text x="600" y="538" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="760">Safety rail across every layer</text><text x="600" y="575" text-anchor="middle" fill="#83eee3" font-family="Inter,Arial,sans-serif" font-size="18">Narrow folders • No silent overwrite • Parser warnings matter • Report every output path</text><text x="66" y="662" fill="#8298aa" font-family="Inter,Arial,sans-serif" font-size="16">DJAI Tools MCP Skills • Local-first • MIT License</text>
</svg>
