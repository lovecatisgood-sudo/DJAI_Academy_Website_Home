<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Decision table for four DJAI AI agent skills</title><desc id="desc">A table matching four agent skills to the questions they answer, their MCP profiles, and expected outputs.</desc><rect width="1200" height="820" rx="28" fill="#f3f8fb"/><rect width="1200" height="148" rx="28" fill="#092039"/><rect y="118" width="1200" height="30" fill="#092039"/><text x="65" y="62" fill="#78e9de" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750" letter-spacing="2">SKILL SELECTION MAP</text><text x="65" y="109" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800">Choose the workflow from the outcome you need</text>
  <g font-family="Inter,Arial,sans-serif"><rect x="65" y="185" width="1070" height="58" rx="10" fill="#d6e6f0"/><text x="90" y="221" fill="#17324b" font-size="17" font-weight="800">SKILL</text><text x="350" y="221" fill="#17324b" font-size="17" font-weight="800">STARTING QUESTION</text><text x="800" y="221" fill="#17324b" font-size="17" font-weight="800">PROFILE / RESULT</text>
    <g fill="#fff" stroke="#d1dfe8"><rect x="65" y="255" width="1070" height="112" rx="12"/><rect x="65" y="379" width="1070" height="112" rx="12"/><rect x="65" y="503" width="1070" height="112" rx="12"/><rect x="65" y="627" width="1070" height="112" rx="12"/></g>
    <g fill="#1d3b52"><text x="90" y="302" fill="#087c71" font-size="20" font-weight="800">document-to-rag</text><text x="350" y="300" font-size="17">Do I need clean, token-aware records</text><text x="350" y="327" font-size="17">for a later retrieval pipeline?</text><text x="800" y="300" font-size="17" font-weight="700">ai-documents</text><text x="800" y="327" font-size="17">JSONL + token/chunk statistics</text>
      <text x="90" y="426" fill="#087c71" font-size="20" font-weight="800">agent-context-</text><text x="90" y="453" fill="#087c71" font-size="20" font-weight="800">preparation</text><text x="350" y="424" font-size="17">Which local sources should a coding agent</text><text x="350" y="451" font-size="17">receive, and how large is the package?</text><text x="800" y="424" font-size="17" font-weight="700">ai-documents</text><text x="800" y="451" font-size="17">Delimited context artifact + count</text>
      <text x="90" y="550" fill="#2d65a1" font-size="20" font-weight="800">batch-data-cleanup</text><text x="350" y="548" font-size="17">Should this CSV be trimmed, deduplicated,</text><text x="350" y="575" font-size="17">or converted to/from flat JSON?</text><text x="800" y="548" font-size="17" font-weight="700">data</text><text x="800" y="575" font-size="17">New CSV/JSON + row report</text>
      <text x="90" y="674" fill="#8a5b14" font-size="20" font-weight="800">private-document-</text><text x="90" y="701" fill="#8a5b14" font-size="20" font-weight="800">processing</text><text x="350" y="672" font-size="17">Is privacy, narrow permission and output</text><text x="350" y="699" font-size="17">traceability the primary requirement?</text><text x="800" y="672" font-size="17" font-weight="700">Narrowest profile</text><text x="800" y="699" font-size="17">Safety checks + complete report</text></g>
    <rect x="65" y="756" width="1070" height="40" rx="10" fill="#dff4f1"/><text x="600" y="782" text-anchor="middle" fill="#116c63" font-size="17" font-weight="750">A skill coordinates supported tools; it does not add missing PDF, OCR, embedding or vector-index capabilities.</text></g>
</svg>
