<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">How DJAI Tools MCP runs locally</title>
  <desc id="desc">A five-step flow from a user request through an AI agent and local MCP server to approved folders and local output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07162b"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#56d6c9"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="170" fill="#28bfae" opacity=".08"/>
  <text x="70" y="78" fill="#8bf0e5" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">LOCAL-FIRST ARCHITECTURE</text>
  <text x="70" y="125" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">How DJAI Tools MCP works</text>
  <text x="70" y="160" fill="#b8c8d9" font-family="Inter,Arial,sans-serif" font-size="20">The user provides the computer, storage and permissions. DJAI never receives the files.</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="65" y="245" width="190" height="175" rx="22" fill="#132f4c" stroke="#315472"/>
    <circle cx="160" cy="285" r="25" fill="#234c69"/><text x="160" y="294" fill="#8bf0e5" font-size="25" text-anchor="middle" font-weight="800">1</text>
    <text x="160" y="338" fill="#fff" font-size="24" text-anchor="middle" font-weight="750">User request</text>
    <text x="160" y="374" fill="#b8c8d9" font-size="16" text-anchor="middle">“Clean this CSV”</text>
    <text x="160" y="398" fill="#b8c8d9" font-size="16" text-anchor="middle">or “Chunk this text”</text>
    <rect x="285" y="245" width="190" height="175" rx="22" fill="#132f4c" stroke="#315472"/>
    <circle cx="380" cy="285" r="25" fill="#234c69"/><text x="380" y="294" fill="#8bf0e5" font-size="25" text-anchor="middle" font-weight="800">2</text>
    <text x="380" y="338" fill="#fff" font-size="24" text-anchor="middle" font-weight="750">AI agent</text>
    <text x="380" y="374" fill="#b8c8d9" font-size="16" text-anchor="middle">Selects an enabled</text>
    <text x="380" y="398" fill="#b8c8d9" font-size="16" text-anchor="middle">MCP tool</text>
    <rect x="505" y="245" width="190" height="175" rx="22" fill="#16433f" stroke="#56d6c9" stroke-width="2"/>
    <circle cx="600" cy="285" r="25" fill="#28756d"/><text x="600" y="294" fill="#fff" font-size="25" text-anchor="middle" font-weight="800">3</text>
    <text x="600" y="338" fill="#fff" font-size="24" text-anchor="middle" font-weight="750">Local MCP</text>
    <text x="600" y="374" fill="#bfeee9" font-size="16" text-anchor="middle">Validates paths, limits</text>
    <text x="600" y="398" fill="#bfeee9" font-size="16" text-anchor="middle">and arguments</text>
    <rect x="725" y="245" width="190" height="175" rx="22" fill="#132f4c" stroke="#315472"/>
    <circle cx="820" cy="285" r="25" fill="#234c69"/><text x="820" y="294" fill="#8bf0e5" font-size="25" text-anchor="middle" font-weight="800">4</text>
    <text x="820" y="338" fill="#fff" font-size="24" text-anchor="middle" font-weight="750">Approved files</text>
    <text x="820" y="374" fill="#b8c8d9" font-size="16" text-anchor="middle">Reads only inside</text>
    <text x="820" y="398" fill="#b8c8d9" font-size="16" text-anchor="middle">allowed directories</text>
    <rect x="945" y="245" width="190" height="175" rx="22" fill="#132f4c" stroke="#315472"/>
    <circle cx="1040" cy="285" r="25" fill="#234c69"/><text x="1040" y="294" fill="#8bf0e5" font-size="25" text-anchor="middle" font-weight="800">5</text>
    <text x="1040" y="338" fill="#fff" font-size="24" text-anchor="middle" font-weight="750">Local output</text>
    <text x="1040" y="374" fill="#b8c8d9" font-size="16" text-anchor="middle">Writes results without</text>
    <text x="1040" y="398" fill="#b8c8d9" font-size="16" text-anchor="middle">changing the input</text>
  </g>
  <g stroke="#56d6c9" stroke-width="4" marker-end="url(#arrow)"><path d="M258 332H278"/><path d="M478 332H498"/><path d="M698 332H718"/><path d="M918 332H938"/></g>
  <rect x="180" y="500" width="840" height="105" rx="22" fill="#0c2038" stroke="#315472"/>
  <text x="600" y="542" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="750">Privacy boundary</text>
  <text x="600" y="578" fill="#8bf0e5" font-family="Inter,Arial,sans-serif" font-size="19" text-anchor="middle">Local stdio • No hosted upload API • No remote URL fetching • Original files preserved</text>
  <text x="70" y="646" fill="#7891a8" font-family="Inter,Arial,sans-serif" font-size="16">DJAI Tools MCP • Open source under the MIT License</text>
</svg>
