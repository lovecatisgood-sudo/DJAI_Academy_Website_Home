<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Eight working tools in DJAI Tools MCP version 0.1.0</title><desc id="desc">A table grouping four AI tools, three data tools, and one QR generation tool, followed by planned future capabilities.</desc>
  <rect width="1200" height="800" rx="28" fill="#f4f8fb"/><rect width="1200" height="145" rx="28" fill="#092039"/><rect y="115" width="1200" height="30" fill="#092039"/>
  <text x="65" y="62" fill="#75eadf" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">CURRENT RELEASE • V0.1.0</text><text x="65" y="108" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="800">Eight working MCP tools available today</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="65" y="185" width="1070" height="55" rx="10" fill="#d9e8f2"/><text x="90" y="220" fill="#17324b" font-size="18" font-weight="800">GROUP</text><text x="265" y="220" fill="#17324b" font-size="18" font-weight="800">MCP TOOL</text><text x="765" y="220" fill="#17324b" font-size="18" font-weight="800">PURPOSE</text>
    <g fill="#fff" stroke="#d3e0e9">
      <rect x="65" y="250" width="1070" height="62" rx="8"/><rect x="65" y="316" width="1070" height="62" rx="8"/><rect x="65" y="382" width="1070" height="62" rx="8"/><rect x="65" y="448" width="1070" height="62" rx="8"/><rect x="65" y="514" width="1070" height="62" rx="8"/><rect x="65" y="580" width="1070" height="62" rx="8"/><rect x="65" y="646" width="1070" height="62" rx="8"/>
    </g>
    <g font-size="17" fill="#1f3b52"><text x="90" y="288" fill="#087b70" font-weight="800">AI</text><text x="265" y="288" font-weight="700">djai_ai_count_tokens</text><text x="765" y="288">Measure tokens, words, bytes and structure</text><text x="90" y="354" fill="#087b70" font-weight="800">AI</text><text x="265" y="354" font-weight="700">djai_ai_optimize_context</text><text x="765" y="354">Clean repeated noise and broken prose</text><text x="90" y="420" fill="#087b70" font-weight="800">AI</text><text x="265" y="420" font-weight="700">djai_ai_chunk_for_rag</text><text x="765" y="420">Write token-aware JSONL chunks</text><text x="90" y="486" fill="#087b70" font-weight="800">AI</text><text x="265" y="486" font-weight="700">djai_ai_package_prompt</text><text x="765" y="486">Package 1–20 files with boundaries</text><text x="90" y="552" fill="#2964a3" font-weight="800">DATA</text><text x="265" y="552" font-weight="700">djai_data_csv_to_json</text><text x="765" y="552">Convert header CSV to JSON</text><text x="90" y="618" fill="#2964a3" font-weight="800">DATA</text><text x="265" y="618" font-weight="700">djai_data_json_to_csv</text><text x="765" y="618">Convert flat JSON objects to CSV</text><text x="90" y="684" fill="#2964a3" font-weight="800">DATA + QR</text><text x="265" y="674" font-weight="700">djai_data_clean_csv</text><text x="265" y="698" font-weight="700">djai_qr_generate</text><text x="765" y="674">Clean CSV rows and exact duplicates</text><text x="765" y="698">Create a local SVG QR code</text></g>
    <rect x="65" y="730" width="1070" height="42" rx="10" fill="#e0f5f2"/><text x="600" y="757" text-anchor="middle" fill="#12685f" font-size="17" font-weight="750">ROADMAP: PDF • DOCX • Thai/English OCR • PNG/JPG/WebP • XLSX — not current MCP commands yet</text>
  </g>
</svg>
