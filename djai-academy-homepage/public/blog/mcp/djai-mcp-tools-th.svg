<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">เครื่องมือที่ใช้งานได้ 8 รายการใน DJAI Tools MCP เวอร์ชัน 0.1.0</title><desc id="desc">ตารางแบ่งเครื่องมือ AI สี่รายการ เครื่องมือข้อมูลสามรายการ และเครื่องมือสร้าง QR หนึ่งรายการ พร้อมความสามารถที่วางแผนไว้ในอนาคต</desc>
  <rect width="1200" height="800" rx="28" fill="#f4f8fb"/><rect width="1200" height="145" rx="28" fill="#092039"/><rect y="115" width="1200" height="30" fill="#092039"/>
  <text x="65" y="62" fill="#75eadf" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="2">CURRENT RELEASE • V0.1.0</text><text x="65" y="108" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="36" font-weight="800">8 MCP Tools ที่ใช้งานได้จริงในปัจจุบัน</text>
  <g font-family="Tahoma,Arial,sans-serif"><rect x="65" y="185" width="1070" height="55" rx="10" fill="#d9e8f2"/><text x="90" y="220" fill="#17324b" font-size="18" font-weight="800">กลุ่ม</text><text x="265" y="220" fill="#17324b" font-size="18" font-weight="800">MCP TOOL</text><text x="765" y="220" fill="#17324b" font-size="18" font-weight="800">หน้าที่</text>
    <g fill="#fff" stroke="#d3e0e9"><rect x="65" y="250" width="1070" height="62" rx="8"/><rect x="65" y="316" width="1070" height="62" rx="8"/><rect x="65" y="382" width="1070" height="62" rx="8"/><rect x="65" y="448" width="1070" height="62" rx="8"/><rect x="65" y="514" width="1070" height="62" rx="8"/><rect x="65" y="580" width="1070" height="62" rx="8"/><rect x="65" y="646" width="1070" height="62" rx="8"/></g>
    <g font-size="17" fill="#1f3b52"><text x="90" y="288" fill="#087b70" font-weight="800">AI</text><text x="265" y="288" font-weight="700">djai_ai_count_tokens</text><text x="765" y="288">นับ token คำ byte และโครงสร้าง</text><text x="90" y="354" fill="#087b70" font-weight="800">AI</text><text x="265" y="354" font-weight="700">djai_ai_optimize_context</text><text x="765" y="354">ล้างข้อความซ้ำและบรรทัดที่แตก</text><text x="90" y="420" fill="#087b70" font-weight="800">AI</text><text x="265" y="420" font-weight="700">djai_ai_chunk_for_rag</text><text x="765" y="420">สร้าง JSONL chunk ตาม token</text><text x="90" y="486" fill="#087b70" font-weight="800">AI</text><text x="265" y="486" font-weight="700">djai_ai_package_prompt</text><text x="765" y="486">รวม 1–20 ไฟล์พร้อมขอบเขต</text><text x="90" y="552" fill="#2964a3" font-weight="800">DATA</text><text x="265" y="552" font-weight="700">djai_data_csv_to_json</text><text x="765" y="552">แปลง CSV ที่มี header เป็น JSON</text><text x="90" y="618" fill="#2964a3" font-weight="800">DATA</text><text x="265" y="618" font-weight="700">djai_data_json_to_csv</text><text x="765" y="618">แปลง flat JSON object เป็น CSV</text><text x="90" y="684" fill="#2964a3" font-weight="800">DATA + QR</text><text x="265" y="674" font-weight="700">djai_data_clean_csv</text><text x="265" y="698" font-weight="700">djai_qr_generate</text><text x="765" y="674">ล้าง CSV และข้อมูลซ้ำแบบตรงกัน</text><text x="765" y="698">สร้าง QR Code แบบ SVG ในเครื่อง</text></g>
    <rect x="65" y="730" width="1070" height="42" rx="10" fill="#e0f5f2"/><text x="600" y="757" text-anchor="middle" fill="#12685f" font-size="17" font-weight="700">ROADMAP: PDF • DOCX • OCR ไทย/อังกฤษ • PNG/JPG/WebP • XLSX — ยังไม่ใช่ MCP command ปัจจุบัน</text>
  </g>
</svg>
