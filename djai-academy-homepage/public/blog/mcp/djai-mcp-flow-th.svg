<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ขั้นตอนการทำงานแบบ Local ของ DJAI Tools MCP</title>
  <desc id="desc">แผนภาพห้าขั้นตอนจากคำสั่งผู้ใช้ ผ่าน AI Agent และ MCP ในเครื่อง ไปยังโฟลเดอร์ที่อนุญาตและไฟล์ผลลัพธ์ในเครื่อง</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07162b"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#56d6c9"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/><circle cx="1080" cy="90" r="170" fill="#28bfae" opacity=".08"/>
  <text x="70" y="78" fill="#8bf0e5" font-family="Tahoma,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">LOCAL-FIRST ARCHITECTURE</text>
  <text x="70" y="125" fill="#ffffff" font-family="Tahoma,Arial,sans-serif" font-size="38" font-weight="800">DJAI Tools MCP ทำงานอย่างไร</text>
  <text x="70" y="160" fill="#b8c8d9" font-family="Tahoma,Arial,sans-serif" font-size="20">ผู้ใช้เป็นผู้ให้เครื่อง พื้นที่เก็บข้อมูล และสิทธิ์เข้าถึง โดย DJAI ไม่ได้รับไฟล์ของผู้ใช้</text>
  <g filter="url(#shadow)" font-family="Tahoma,Arial,sans-serif">
    <rect x="65" y="245" width="190" height="175" rx="22" fill="#132f4c" stroke="#315472"/><circle cx="160" cy="285" r="25" fill="#234c69"/><text x="160" y="294" fill="#8bf0e5" font-size="25" text-anchor="middle" font-weight="800">1</text><text x="160" y="338" fill="#fff" font-size="23" text-anchor="middle" font-weight="700">คำสั่งผู้ใช้</text><text x="160" y="374" fill="#b8c8d9" font-size="15" text-anchor="middle">“ทำความสะอาด CSV”</text><text x="160" y="398" fill="#b8c8d9" font-size="15" text-anchor="middle">หรือ “แบ่งข้อความ”</text>
    <rect x="285" y="245" width="190" height="175" rx="22" fill="#132f4c" stroke="#315472"/><circle cx="380" cy="285" r="25" fill="#234c69"/><text x="380" y="294" fill="#8bf0e5" font-size="25" text-anchor="middle" font-weight="800">2</text><text x="380" y="338" fill="#fff" font-size="23" text-anchor="middle" font-weight="700">AI Agent</text><text x="380" y="374" fill="#b8c8d9" font-size="15" text-anchor="middle">เลือก MCP Tool</text><text x="380" y="398" fill="#b8c8d9" font-size="15" text-anchor="middle">ที่เปิดใช้งานไว้</text>
    <rect x="505" y="245" width="190" height="175" rx="22" fill="#16433f" stroke="#56d6c9" stroke-width="2"/><circle cx="600" cy="285" r="25" fill="#28756d"/><text x="600" y="294" fill="#fff" font-size="25" text-anchor="middle" font-weight="800">3</text><text x="600" y="338" fill="#fff" font-size="23" text-anchor="middle" font-weight="700">MCP ในเครื่อง</text><text x="600" y="374" fill="#bfeee9" font-size="15" text-anchor="middle">ตรวจ path, limit</text><text x="600" y="398" fill="#bfeee9" font-size="15" text-anchor="middle">และ arguments</text>
    <rect x="725" y="245" width="190" height="175" rx="22" fill="#132f4c" stroke="#315472"/><circle cx="820" cy="285" r="25" fill="#234c69"/><text x="820" y="294" fill="#8bf0e5" font-size="25" text-anchor="middle" font-weight="800">4</text><text x="820" y="338" fill="#fff" font-size="22" text-anchor="middle" font-weight="700">ไฟล์ที่อนุญาต</text><text x="820" y="374" fill="#b8c8d9" font-size="15" text-anchor="middle">อ่านเฉพาะในโฟลเดอร์</text><text x="820" y="398" fill="#b8c8d9" font-size="15" text-anchor="middle">ที่กำหนดไว้</text>
    <rect x="945" y="245" width="190" height="175" rx="22" fill="#132f4c" stroke="#315472"/><circle cx="1040" cy="285" r="25" fill="#234c69"/><text x="1040" y="294" fill="#8bf0e5" font-size="25" text-anchor="middle" font-weight="800">5</text><text x="1040" y="338" fill="#fff" font-size="22" text-anchor="middle" font-weight="700">ผลลัพธ์ในเครื่อง</text><text x="1040" y="374" fill="#b8c8d9" font-size="15" text-anchor="middle">เขียนไฟล์ใหม่โดยไม่</text><text x="1040" y="398" fill="#b8c8d9" font-size="15" text-anchor="middle">แก้ไขไฟล์ต้นฉบับ</text>
  </g>
  <g stroke="#56d6c9" stroke-width="4" marker-end="url(#arrow)"><path d="M258 332H278"/><path d="M478 332H498"/><path d="M698 332H718"/><path d="M918 332H938"/></g>
  <rect x="180" y="500" width="840" height="105" rx="22" fill="#0c2038" stroke="#315472"/><text x="600" y="542" fill="#ffffff" font-family="Tahoma,Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="700">ขอบเขตความเป็นส่วนตัว</text><text x="600" y="578" fill="#8bf0e5" font-family="Tahoma,Arial,sans-serif" font-size="18" text-anchor="middle">Local stdio • ไม่มีระบบ upload • ไม่ดึง URL ภายนอก • เก็บไฟล์ต้นฉบับไว้เสมอ</text>
  <text x="70" y="646" fill="#7891a8" font-family="Tahoma,Arial,sans-serif" font-size="16">DJAI Tools MCP • โอเพนซอร์สภายใต้ MIT License</text>
</svg>
