<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Agent Skill จัดลำดับ DJAI MCP Tools อย่างไร</title><desc id="desc">แผนภาพสี่ชั้นจากเป้าหมายผู้ใช้ ผ่าน Agent Skill และ MCP Tools ไปยังผลลัพธ์ในเครื่อง พร้อมกฎความปลอดภัยตลอด workflow</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081a31"/><stop offset="1" stop-color="#143a4b"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#66e3d6"/></marker><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".22"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/><circle cx="1085" cy="92" r="185" fill="#55d8c9" opacity=".07"/><text x="66" y="70" fill="#83eee3" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="750" letter-spacing="2">TOOLS ลงมือทำ • SKILLS กำหนดวิธีคิดและลำดับ</text><text x="66" y="118" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="38" font-weight="800">จากเป้าหมายผู้ใช้สู่ผลลัพธ์ Local ที่ตรวจสอบได้</text><text x="66" y="154" fill="#b7cada" font-family="Tahoma,Arial,sans-serif" font-size="19">Skill คือ Playbook ที่เชื่อมคำสั่งภาษาธรรมชาติกับ MCP Operation แต่ละขั้นตอน</text>
  <g filter="url(#s)" font-family="Tahoma,Arial,sans-serif"><rect x="66" y="230" width="235" height="190" rx="22" fill="#173451" stroke="#355c7a"/><circle cx="184" cy="270" r="25" fill="#245475"/><text x="184" y="279" text-anchor="middle" fill="#83eee3" font-size="24" font-weight="800">1</text><text x="184" y="326" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">เป้าหมายผู้ใช้</text><text x="184" y="362" text-anchor="middle" fill="#bfd0dc" font-size="15">“เตรียม Note เหล่านี้</text><text x="184" y="387" text-anchor="middle" fill="#bfd0dc" font-size="15">สำหรับ RAG Pipeline”</text>
    <rect x="344" y="230" width="235" height="190" rx="22" fill="#174b47" stroke="#66e3d6" stroke-width="2"/><circle cx="462" cy="270" r="25" fill="#2a847b"/><text x="462" y="279" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">2</text><text x="462" y="326" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Agent Skill</text><text x="462" y="362" text-anchor="middle" fill="#c7f4ef" font-size="15">เลือกลำดับ จุดตรวจ</text><text x="462" y="387" text-anchor="middle" fill="#c7f4ef" font-size="15">Limit และรูปแบบรายงาน</text>
    <rect x="622" y="230" width="235" height="190" rx="22" fill="#173451" stroke="#355c7a"/><circle cx="740" cy="270" r="25" fill="#245475"/><text x="740" y="279" text-anchor="middle" fill="#83eee3" font-size="24" font-weight="800">3</text><text x="740" y="326" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">MCP Tools</text><text x="740" y="362" text-anchor="middle" fill="#bfd0dc" font-size="15">นับ → ทำความสะอาด</text><text x="740" y="387" text-anchor="middle" fill="#bfd0dc" font-size="15">→ แบ่ง Chunk ในเครื่อง</text>
    <rect x="900" y="230" width="235" height="190" rx="22" fill="#173451" stroke="#355c7a"/><circle cx="1018" cy="270" r="25" fill="#245475"/><text x="1018" y="279" text-anchor="middle" fill="#83eee3" font-size="24" font-weight="800">4</text><text x="1018" y="326" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">ผลลัพธ์ Local</text><text x="1018" y="362" text-anchor="middle" fill="#bfd0dc" font-size="15">JSONL ใหม่ + สถิติ</text><text x="1018" y="387" text-anchor="middle" fill="#bfd0dc" font-size="15">เก็บไฟล์ต้นฉบับไว้</text></g>
  <g stroke="#66e3d6" stroke-width="4" marker-end="url(#a)"><path d="M306 325h30"/><path d="M584 325h30"/><path d="M862 325h30"/></g><rect x="150" y="495" width="900" height="118" rx="23" fill="#0c223a" stroke="#3f687f"/><text x="600" y="538" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="23" font-weight="700">Safety Rail ที่ใช้ตลอดทุกขั้นตอน</text><text x="600" y="575" text-anchor="middle" fill="#83eee3" font-family="Tahoma,Arial,sans-serif" font-size="18">จำกัดโฟลเดอร์ • ไม่เขียนทับเงียบๆ • ไม่มองข้าม Warning • รายงานทุก Output Path</text><text x="66" y="662" fill="#8298aa" font-family="Tahoma,Arial,sans-serif" font-size="16">DJAI Tools MCP Skills • Local-first • MIT License</text>
</svg>
