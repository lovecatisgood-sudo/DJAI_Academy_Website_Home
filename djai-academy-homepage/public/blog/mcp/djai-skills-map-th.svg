<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">ตารางเลือก AI Agent Skill ทั้ง 4 ของ DJAI</title><desc id="desc">ตารางจับคู่ Agent Skill สี่รายการกับคำถามเริ่มต้น MCP profile และผลลัพธ์ที่คาดหวัง</desc><rect width="1200" height="820" rx="28" fill="#f3f8fb"/><rect width="1200" height="148" rx="28" fill="#092039"/><rect y="118" width="1200" height="30" fill="#092039"/><text x="65" y="62" fill="#78e9de" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="750" letter-spacing="2">SKILL SELECTION MAP</text><text x="65" y="109" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="36" font-weight="800">เลือก Workflow จากผลลัพธ์ที่ต้องการ</text>
  <g font-family="Tahoma,Arial,sans-serif"><rect x="65" y="185" width="1070" height="58" rx="10" fill="#d6e6f0"/><text x="90" y="221" fill="#17324b" font-size="17" font-weight="800">SKILL</text><text x="350" y="221" fill="#17324b" font-size="17" font-weight="800">คำถามเริ่มต้น</text><text x="800" y="221" fill="#17324b" font-size="17" font-weight="800">PROFILE / ผลลัพธ์</text><g fill="#fff" stroke="#d1dfe8"><rect x="65" y="255" width="1070" height="112" rx="12"/><rect x="65" y="379" width="1070" height="112" rx="12"/><rect x="65" y="503" width="1070" height="112" rx="12"/><rect x="65" y="627" width="1070" height="112" rx="12"/></g>
    <g fill="#1d3b52"><text x="90" y="302" fill="#087c71" font-size="20" font-weight="800">document-to-rag</text><text x="350" y="300" font-size="17">ต้องการ Record ที่สะอาดและแบ่งตาม</text><text x="350" y="327" font-size="17">Token สำหรับ Retrieval Pipeline หรือไม่?</text><text x="800" y="300" font-size="17" font-weight="700">ai-documents</text><text x="800" y="327" font-size="17">JSONL + สถิติ Token/Chunk</text>
      <text x="90" y="426" fill="#087c71" font-size="20" font-weight="800">agent-context-</text><text x="90" y="453" fill="#087c71" font-size="20" font-weight="800">preparation</text><text x="350" y="424" font-size="17">Coding Agent ควรได้รับ Source ใด</text><text x="350" y="451" font-size="17">และ Package มีขนาดเท่าไร?</text><text x="800" y="424" font-size="17" font-weight="700">ai-documents</text><text x="800" y="451" font-size="17">Context Artifact + Token Count</text>
      <text x="90" y="550" fill="#2d65a1" font-size="20" font-weight="800">batch-data-cleanup</text><text x="350" y="548" font-size="17">ต้อง Trim, ลบ Exact Duplicate หรือ</text><text x="350" y="575" font-size="17">แปลง CSV กับ Flat JSON หรือไม่?</text><text x="800" y="548" font-size="17" font-weight="700">data</text><text x="800" y="575" font-size="17">CSV/JSON ใหม่ + รายงานแถว</text>
      <text x="90" y="674" fill="#8a5b14" font-size="20" font-weight="800">private-document-</text><text x="90" y="701" fill="#8a5b14" font-size="20" font-weight="800">processing</text><text x="350" y="672" font-size="17">Privacy, สิทธิ์แคบ และการติดตาม</text><text x="350" y="699" font-size="17">Output คือข้อกำหนดหลักหรือไม่?</text><text x="800" y="672" font-size="17" font-weight="700">Profile ที่แคบที่สุด</text><text x="800" y="699" font-size="17">Safety Check + รายงานครบ</text></g><rect x="65" y="756" width="1070" height="40" rx="10" fill="#dff4f1"/><text x="600" y="782" text-anchor="middle" fill="#116c63" font-size="17" font-weight="750">Skill จัดลำดับ Tool ที่รองรับ แต่ไม่ได้เพิ่ม PDF, OCR, Embedding หรือ Vector Index ที่ยังไม่มี</text></g>
</svg>
