<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Claude Opus 5 pricing comparison</title>
  <desc id="desc">A DJAI Academy chart comparing input and output token prices for Claude Opus 5, Claude Fable 5, Claude Sonnet 5, Claude Haiku 4.5 and GPT-5.5.</desc>
  <rect width="1200" height="720" fill="#071527"/>
  <circle cx="1080" cy="90" r="180" fill="#1eb7ff" opacity="0.12"/>
  <circle cx="130" cy="650" r="220" fill="#18e0b7" opacity="0.10"/>
  <text x="72" y="82" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">Opus 5 price sits below frontier-premium tiers</text>
  <text x="72" y="122" fill="#a9bfdc" font-family="Inter,Arial,sans-serif" font-size="22">USD per 1M tokens. Output tokens are the expensive side of most coding and agent workflows.</text>
  <g transform="translate(84 172)">
    <line x1="0" y1="420" x2="1030" y2="420" stroke="#335072" stroke-width="2"/>
    <g fill="#7892b8" font-family="Inter,Arial,sans-serif" font-size="16">
      <text x="0" y="456">$0</text>
      <text x="236" y="456">$15</text>
      <text x="476" y="456">$30</text>
      <text x="716" y="456">$45</text>
      <text x="956" y="456">$60</text>
    </g>
    <g stroke="#1b3453" stroke-width="1">
      <line x1="240" y1="30" x2="240" y2="420"/>
      <line x1="480" y1="30" x2="480" y2="420"/>
      <line x1="720" y1="30" x2="720" y2="420"/>
      <line x1="960" y1="30" x2="960" y2="420"/>
    </g>
    <g font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#ffffff">
      <text x="0" y="64">Claude Opus 5</text>
      <text x="0" y="144">Claude Fable 5</text>
      <text x="0" y="224">Claude Sonnet 5</text>
      <text x="0" y="304">Claude Haiku 4.5</text>
      <text x="0" y="384">GPT-5.5</text>
    </g>
    <g font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">
      <rect x="250" y="38" width="80" height="24" rx="5" fill="#18e0b7"/>
      <rect x="250" y="68" width="400" height="24" rx="5" fill="#ffb547"/>
      <text x="342" y="58" fill="#d6f8f0">$5 input</text>
      <text x="662" y="88" fill="#ffe5b9">$25 output</text>
      <rect x="250" y="118" width="160" height="24" rx="5" fill="#18e0b7"/>
      <rect x="250" y="148" width="800" height="24" rx="5" fill="#ffb547"/>
      <text x="422" y="138" fill="#d6f8f0">$10 input</text>
      <text x="1062" y="168" fill="#ffe5b9">$50 output</text>
      <rect x="250" y="198" width="32" height="24" rx="5" fill="#18e0b7"/>
      <rect x="250" y="228" width="160" height="24" rx="5" fill="#ffb547"/>
      <text x="294" y="218" fill="#d6f8f0">$2 input</text>
      <text x="422" y="248" fill="#ffe5b9">$10 output</text>
      <rect x="250" y="278" width="16" height="24" rx="5" fill="#18e0b7"/>
      <rect x="250" y="308" width="80" height="24" rx="5" fill="#ffb547"/>
      <text x="278" y="298" fill="#d6f8f0">$1 input</text>
      <text x="342" y="328" fill="#ffe5b9">$5 output</text>
      <rect x="250" y="358" width="80" height="24" rx="5" fill="#18e0b7"/>
      <rect x="250" y="388" width="480" height="24" rx="5" fill="#ffb547"/>
      <text x="342" y="378" fill="#d6f8f0">$5 input</text>
      <text x="742" y="408" fill="#ffe5b9">$30 output</text>
    </g>
  </g>
  <text x="72" y="686" fill="#7f98bb" font-family="Inter,Arial,sans-serif" font-size="16">Source basis: Anthropic pricing docs and OpenAI model docs, accessed July 27, 2026. Chart created by DJAI Academy.</text>
</svg>
