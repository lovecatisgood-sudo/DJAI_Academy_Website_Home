<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent skill layer diagram</title>
  <desc id="desc">A visual comparison of prompts, system instructions, and reusable agent skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061834"/>
      <stop offset="55%" stop-color="#10164a"/>
      <stop offset="100%" stop-color="#3c1a70"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5dd9ef"/>
      <stop offset="100%" stop-color="#f97357"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <circle cx="1030" cy="80" r="150" fill="#5dd9ef" opacity=".12"/>
  <circle cx="120" cy="650" r="180" fill="#f97357" opacity=".12"/>
  <text x="80" y="92" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800">Where skills sit in an agent workflow</text>
  <text x="80" y="134" fill="#b7c7e6" font-family="Inter,Arial,sans-serif" font-size="20">A prompt asks once. A skill gives the agent a reusable operating procedure.</text>
  <g filter="url(#shadow)">
    <rect x="85" y="190" width="290" height="360" rx="28" fill="#fff"/>
    <rect x="455" y="190" width="290" height="360" rx="28" fill="#fff"/>
    <rect x="825" y="190" width="290" height="360" rx="28" fill="#fff"/>
  </g>
  <rect x="115" y="225" width="86" height="86" rx="22" fill="#eff6ff"/>
  <text x="137" y="280" fill="#12345c" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">1</text>
  <text x="115" y="360" fill="#071a3f" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Prompt</text>
  <text x="115" y="405" fill="#50627a" font-family="Inter,Arial,sans-serif" font-size="18">A one-time request:</text>
  <text x="115" y="438" fill="#50627a" font-family="Inter,Arial,sans-serif" font-size="18">“Build this feature.”</text>
  <text x="115" y="486" fill="#8aa0bd" font-family="Inter,Arial,sans-serif" font-size="16">Useful, but easy to forget</text>
  <text x="115" y="512" fill="#8aa0bd" font-family="Inter,Arial,sans-serif" font-size="16">as the session grows.</text>
  <rect x="485" y="225" width="86" height="86" rx="22" fill="#fff3ed"/>
  <text x="507" y="280" fill="#b94c2f" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">2</text>
  <text x="485" y="360" fill="#071a3f" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Instruction</text>
  <text x="485" y="405" fill="#50627a" font-family="Inter,Arial,sans-serif" font-size="18">General behavior:</text>
  <text x="485" y="438" fill="#50627a" font-family="Inter,Arial,sans-serif" font-size="18">“Be careful. Run tests.”</text>
  <text x="485" y="486" fill="#8aa0bd" font-family="Inter,Arial,sans-serif" font-size="16">Sets defaults, but usually</text>
  <text x="485" y="512" fill="#8aa0bd" font-family="Inter,Arial,sans-serif" font-size="16">does not teach a workflow.</text>
  <rect x="855" y="225" width="86" height="86" rx="22" fill="url(#accent)"/>
  <text x="877" y="280" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">3</text>
  <text x="855" y="360" fill="#071a3f" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">Skill</text>
  <text x="855" y="405" fill="#50627a" font-family="Inter,Arial,sans-serif" font-size="18">Reusable procedure:</text>
  <text x="855" y="438" fill="#50627a" font-family="Inter,Arial,sans-serif" font-size="18">when to use, steps, traps,</text>
  <text x="855" y="465" fill="#50627a" font-family="Inter,Arial,sans-serif" font-size="18">verification, examples.</text>
  <text x="855" y="512" fill="#8aa0bd" font-family="Inter,Arial,sans-serif" font-size="16">Turns judgment into</text>
  <text x="855" y="538" fill="#8aa0bd" font-family="Inter,Arial,sans-serif" font-size="16">repeatable agent behavior.</text>
  <path d="M385 370h58" stroke="#5dd9ef" stroke-width="5" stroke-linecap="round"/>
  <path d="M428 350l20 20-20 20" fill="none" stroke="#5dd9ef" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M755 370h58" stroke="#5dd9ef" stroke-width="5" stroke-linecap="round"/>
  <path d="M798 350l20 20-20 20" fill="none" stroke="#5dd9ef" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="235" y="610" width="730" height="50" rx="25" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.18)"/>
  <text x="276" y="642" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Prompt gives direction → instruction sets defaults → skill provides execution discipline</text>
</svg>
